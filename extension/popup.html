<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页影片一键采集助手</title><link rel="stylesheet" href="popup.css">
<body><header><span class="badge">影片收藏 · 本地保存</span><h1>网页影片一键采集助手</h1><p>从当前帖子，整理你的影片资源</p></header>
<main><section><h2>当前页面 <span id="support">正在识别</span></h2><p id="url" class="muted"></p><h3 id="title">读取帖子中…</h3><p id="adapter" class="muted"></p><div id="previews"></div><p id="counts"></p><p id="warnings" class="warning"></p><label id="confirmWrap" hidden><input type="checkbox" id="confirmImages">我已检查上述图片，确认按识别地址保存</label><label>选择磁力链接<select id="magnets"></select></label></section>
<section><h2>采集设置</h2><p id="root">连接本地程序中…</p><label><input type="checkbox" id="save_images" checked>保存两张预览原图</label><label><input type="checkbox" id="save_magnet" checked>保存磁力链接</label><label><input type="checkbox" id="auto_bitcomet" checked>调用 BitComet（需确认任务目录）</label><p id="duplicate" class="warning"></p><label><input type="checkbox" id="resubmit">再次发送磁力（仅主动勾选时重发）</label></section>
<div class="controls"><button id="collect" class="primary" disabled>一键采集并下载</button><div class="actions"><button id="repair" disabled>检查缺失文件</button><button id="open" disabled>打开保存目录</button><button id="copyFolder" disabled>复制目录</button><button id="options">设置</button><button id="cancel" disabled>取消任务</button></div></div><section aria-live="polite"><h2>操作状态</h2><pre id="status">正在识别网页</pre></section></main><script type="module" src="popup.js"></script></body></html>
